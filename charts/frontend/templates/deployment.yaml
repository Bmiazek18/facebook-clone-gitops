apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: nuxt-app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          env:
            - name: NUXT_PUBLIC_KEYCLOAK_URL
              value: {{ .Values.keycloak.publicUrl | default .Values.keycloakUrl | quote }}
            - name: NUXT_KEYCLOAK_SERVER_URL
              value: {{ .Values.keycloak.internalUrl | default "http://keycloak-service.apps.svc.cluster.local:8080" | quote }}
            - name: NUXT_KEYCLOAK_INTERNAL_URL
              value: {{ .Values.keycloak.internalUrl | default "http://keycloak-service.apps.svc.cluster.local:8080" | quote }}
            - name: KEYCLOAK_SERVER_URL
              value: {{ .Values.keycloak.internalUrl | default "http://keycloak-service.apps.svc.cluster.local:8080" | quote }}
            - name: KEYCLOAK_INTERNAL_URL
              value: {{ .Values.keycloak.internalUrl | default "http://keycloak-service.apps.svc.cluster.local:8080" | quote }}
            - name: NUXT_PUBLIC_FRONTEND_URL
              value: {{ .Values.frontendUrl | quote }}
            - name: NUXT_PUBLIC_API_URL
              value: {{ .Values.apiUrl | quote }}
            - name: NUXT_PUBLIC_MQTT_URL
              value: {{ .Values.mqttUrl | quote }}
            - name: REDIS_HOST
              value: {{ .Values.redis.host | default "redis.apps.svc.cluster.local" | quote }}
            - name: REDIS_PORT
              value: {{ .Values.redis.port | default "6379" | quote }}
            - name: REDIS_URL
              value: {{ .Values.redis.url | default "redis://redis.apps.svc.cluster.local:6379" | quote }}
            - name: NUXT_REDIS_HOST
              value: {{ .Values.redis.host | default "redis.apps.svc.cluster.local" | quote }}
            - name: NUXT_REDIS_PORT
              value: {{ .Values.redis.port | default "6379" | quote }}
            - name: NUXT_REDIS_URL
              value: {{ .Values.redis.url | default "redis://redis.apps.svc.cluster.local:6379" | quote }}
            - name: CHAT_SERVICE_URL
              value: {{ .Values.chatServiceUrl | default "http://chat-service.apps.svc.cluster.local:8087" | quote }}
            - name: NOTIFICATION_SERVICE_URL
              value: {{ .Values.notificationServiceUrl | default "http://notificationservice.apps.svc.cluster.local:8083" | quote }}
            - name: ANALYTICS_SERVICE_URL
              value: {{ .Values.analyticsServiceUrl | default "http://analytics-service.apps.svc.cluster.local:8095" | quote }}
            - name: SEARCH_SERVICE_URL
              value: {{ .Values.searchServiceUrl | default "http://search-service.apps.svc.cluster.local:8088" | quote }}
            - name: MARKETPLACE_SERVICE_URL
              value: {{ .Values.marketplaceServiceUrl | default "http://marketplace-service.apps.svc.cluster.local:8090" | quote }}
            - name: USER_SERVICE_URL
              value: {{ .Values.userServiceUrl | default "http://userservice.apps.svc.cluster.local:8081" | quote }}
            - name: APOLLO_ROUTER_URL
              value: {{ .Values.apolloRouterUrl | default "http://apollo-router.apps.svc.cluster.local:4000/graphql" | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}