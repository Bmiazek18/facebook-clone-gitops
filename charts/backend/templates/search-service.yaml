apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  name: search-service
  namespace: apps
  labels:
    app: search-service
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: search-service
  template:
    metadata:
      labels:
        app: search-service

      annotations:

        prometheus.io/scrape: "true"

        prometheus.io/path: "/actuator/prometheus"

        prometheus.io/port: "8087"
    spec:
      {{- if .Values.istio.enabled }}

      serviceAccountName: search-service-sa

      {{- end }}

      containers:
        - name: search-service
          image: "{{ .Values.images.searchService.repository }}:{{ .Values.images.searchService.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8088
            - name: grpc
              containerPort: 9097
          env:
            - name: RABBITMQ_HOST
              value: "rabbitmq"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USERNAME
              value: "guest"
            - name: RABBITMQ_PASSWORD
              value: "guest"
            - name: MEILI_HOST
              value: "http://meilisearch:7700"
            - name: MEILI_API_KEY
              value: "masterKey"
            - name: USER_SERVICE_GRPC_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: backend-runtime-config
                  key: USER_SERVICE_GRPC_ADDRESS
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: backend-runtime-secrets
                  key: SENTRY_DSN
                  optional: true
            - name: SENTRY_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: backend-runtime-config
                  key: SENTRY_ENVIRONMENT
                  optional: true
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: backend-runtime-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
                  optional: true
            - name: OTEL_SERVICE_NAME
              value: "search-service"
            - name: JAVA_TOOL_OPTIONS
              value: -Xms64m -Xmx128m
          readinessProbe:
            grpc:
              port: grpc
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: grpc
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  name: search-service
  namespace: apps
spec:
  selector:
    app: search-service
  ports:
    - name: http
      port: 8088
      targetPort: http
    - name: grpc
      port: 9097
      targetPort: grpc
  type: ClusterIP
