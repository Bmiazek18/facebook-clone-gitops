apiVersion: v1
kind: Secret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: minio-creds-secret
  namespace: apps
type: Opaque
stringData:
  config.env: |-
    export MINIO_ROOT_USER={{ .Values.secrets.MINIO_ACCESS_KEY | default "minioadmin" }}
    export MINIO_ROOT_PASSWORD={{ .Values.secrets.MINIO_SECRET_KEY | default "minioadmin" }}
    export MINIO_BROWSER=on
  rootUser: {{ .Values.secrets.MINIO_ACCESS_KEY | default "minioadmin" | quote }}
  rootPassword: {{ .Values.secrets.MINIO_SECRET_KEY | default "minioadmin" | quote }}
  accesskey: {{ .Values.secrets.MINIO_ACCESS_KEY | default "minioadmin" | quote }}
  secretkey: {{ .Values.secrets.MINIO_SECRET_KEY | default "minioadmin" | quote }}

---
apiVersion: minio.min.io/v2
kind: Tenant
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: minio
  namespace: apps
spec:
  image: minio/minio:RELEASE.2024-01-28T22-35-53Z
  imagePullPolicy: {{ .Values.imagePullPolicy }}
  configuration:
    name: minio-creds-secret
  credsSecret:
    name: minio-creds-secret
  pools:
    - name: pool-0
      servers: 2              # 2 nodes for High Availability in the home-lab
      volumesPerServer: 2     # 2 drives per node (giving 4 drives total, perfect for Erasure Coding parity)
      volumeClaimTemplate:
        spec:
          accessModes: [ "ReadWriteOnce" ]
          storageClassName: local-path
          resources:
            requests:
              storage: 5Gi    # 5Gi per drive = 20Gi raw storage
      resources:
        {{- toYaml .Values.resources | nindent 8 }}
  requestAutoCert: false       # Set to false to simplify home-lab setups without local TLS/cert-manager
  features:
    bucketDNS: false
