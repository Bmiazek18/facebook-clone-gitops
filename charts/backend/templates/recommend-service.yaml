apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommend-service
  labels:
    app: recommend-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommend-service
  template:
    metadata:
      labels:
        app: recommend-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8096"
    spec:
      {{- if .Values.istio.enabled }}
      serviceAccountName: recommend-service-sa
      {{- end }}
      containers:
        - name: recommend-service
          image: "{{ .Values.images.recommendService.repository | default "ghcr.io/bmiazek18/facebook-clone1-recommend-service" }}:{{ .Values.images.recommendService.tag | default "latest" }}"
          ports:
            - name: http
              containerPort: 8096
          env:
            - name: CLICKHOUSE_HOST
              value: "clickhouse-analytics.apps.svc.cluster.local"
            - name: CLICKHOUSE_PORT
              value: "8123"
            - name: CLICKHOUSE_DB
              value: "analytics_db"
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: backend-runtime-secrets
                  key: CLICKHOUSE_USER
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-runtime-secrets
                  key: CLICKHOUSE_PASSWORD
            - name: REDIS_CONNECTION_STRING
              value: "redis://redis-master.apps.svc.cluster.local:6379"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: backend-runtime-config
                  key: SPRING_KAFKA_BOOTSTRAP_SERVERS
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: recommend-service
spec:
  selector:
    app: recommend-service
  ports:
    - name: http
      port: 8096
      targetPort: http
