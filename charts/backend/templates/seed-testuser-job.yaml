apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  name: seed-testuser-job
  namespace: {{ .Release.Namespace | default "apps" }}
spec:
  ttlSecondsAfterFinished: 120
  backoffLimit: 5
  template:
    metadata:
      name: seed-testuser
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seeder
          image: bitnami/postgresql:16
          command:
            - /bin/bash
            - -c
            - |
              set -e
              echo "=== 1. Seeding testuser in PostgreSQL (users_db) ==="
              export PGPASSWORD="$POSTGRES_PASSWORD"
              until psql -h postgresql-user -U postgres -d users_db -c '\q'; do
                echo "Waiting for PostgreSQL users_db to be ready..."
                sleep 2
              done

              # Ensure table and insert user with the exact Keycloak sub UUID
              psql -h postgresql-user -U postgres -d users_db << 'EOSQL'
              CREATE TABLE IF NOT EXISTS users (
                id VARCHAR(64) PRIMARY KEY,
                username VARCHAR(100) UNIQUE,
                email VARCHAR(255) UNIQUE,
                first_name VARCHAR(100),
                last_name VARCHAR(100),
                is_active BOOLEAN DEFAULT TRUE,
                created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
                updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
              );
              INSERT INTO users (id, username, email, first_name, last_name)
              VALUES ('e1088d18-971c-4bbf-a6ea-b7692fc3f412', 'testuser', 'testuser@lab-bm.com', 'Test', 'User')
              ON CONFLICT (id) DO NOTHING;
EOSQL
              echo "Successfully synced testuser into PostgreSQL!"

              echo "=== 2. Seeding testuser in Neo4j (socialgraph) ==="
              AUTH_B64=$(echo -n "$NEO4J_AUTH" | base64 | tr -d '\n')
              curl -s -f -X POST "http://neo4j:7474/db/neo4j/tx/commit" \
                -H "Content-Type: application/json" \
                -H "Authorization: Basic $AUTH_B64" \
                -d '{"statements":[{"statement":"MERGE (u:User {id: \"e1088d18-971c-4bbf-a6ea-b7692fc3f412\"}) ON CREATE SET u.username = \"testuser\", u.firstName = \"Test\", u.lastName = \"User\", u.email = \"testuser@lab-bm.com\", u.createdAt = datetime()"}]}' || true
              echo "Successfully synced testuser into Neo4j graph!"
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: neo4j-credentials
                  key: auth
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
