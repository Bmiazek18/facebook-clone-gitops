{{- if .Values.istio.enabled }}
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  name: default-mtls
  namespace: {{ .Release.Namespace | default "default" }}
spec:
  mtls:
    mode: STRICT
---
{{- $services := list "userservice" "userservice-edge" "socialgraph-service" "socialgraph-edge" "search-service" "video-abr-service" "apollo-router" "tusd" "feedservice" "feed-edge-service" "chat-service" "chat-edge-service" "mqtt-broker" "linkguard-service" "inference-service" "notificationservice" }}
{{- range $services }}
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  name: {{ . }}-cb
  namespace: {{ $.Release.Namespace | default "default" }}
spec:
  host: {{ . }}
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 10
        maxRequestsPerConnection: 10
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
---
{{- end }}
{{- end }}
