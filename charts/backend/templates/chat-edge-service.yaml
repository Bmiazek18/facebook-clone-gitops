apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-edge-service
  labels:
    app: chat-edge-service
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: chat-edge-service
  template:
    metadata:
      labels:
        app: chat-edge-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8089"
    spec:
      {{- if .Values.istio.enabled }}
      serviceAccountName: chat-edge-service-sa
      {{- end }}
      containers:
        - name: chat-edge-service
          image: "{{ .Values.images.chatEdgeService.repository }}:{{ .Values.images.chatEdgeService.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8089
          env:
            - name: CHAT_SERVICE_GRPC_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: backend-runtime-config
                  key: CHAT_SERVICE_GRPC_ADDRESS
            - name: USER_SERVICE_GRPC_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: backend-runtime-config
                  key: USER_SERVICE_GRPC_ADDRESS
            - name: VAULT_URI
              valueFrom:
                configMapKeyRef:
                  name: backend-runtime-config
                  key: VAULT_URI
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backend-runtime-secrets
                  key: VAULT_TOKEN
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: backend-runtime-secrets
                  key: SENTRY_DSN
            - name: SENTRY_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: backend-runtime-config
                  key: SENTRY_ENVIRONMENT
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: backend-runtime-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
            - name: JAVA_TOOL_OPTIONS
              value: -Xms128m -Xmx256m
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: chat-edge-service
spec:
  selector:
    app: chat-edge-service
  ports:
    - name: http
      port: 8089
      targetPort: http
