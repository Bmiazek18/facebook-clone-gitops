apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  name: userservice-edge
  labels:
    app: userservice-edge
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: userservice-edge
  template:
    metadata:
      labels:
        app: userservice-edge

      annotations:

        prometheus.io/scrape: "true"

        prometheus.io/path: "/actuator/prometheus"

        prometheus.io/port: "8081"
    spec:
      {{- if .Values.istio.enabled }}

      serviceAccountName: userservice-edge-sa

      {{- end }}

      containers:
        - name: user-edge-service
          image: "{{ .Values.images.userEdgeService.repository }}:{{ .Values.images.userEdgeService.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: USER_SERVICE_GRPC_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: backend-runtime-config
                  key: USER_SERVICE_GRPC_ADDRESS
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: backend-runtime-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
            - name: JAVA_TOOL_OPTIONS
              value: -Xms256m -Xmx512m
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  name: userservice-edge
spec:
  selector:
    app: userservice-edge
  ports:
    - name: http
      port: 8081
      targetPort: http
