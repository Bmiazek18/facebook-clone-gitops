apiVersion: batch/v1
kind: Job
metadata:
  name: vault-init
  namespace: apps
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    metadata:
      labels:
        app: vault-init
    spec:
      restartPolicy: OnFailure
      containers:
      - name: vault-init
        image: hashicorp/vault:1.15.6
        env:
        - name: VAULT_ADDR
          value: "http://vault:8200"
        - name: VAULT_TOKEN
          value: "vault-root-token"
        command:
        - sh
        - -c
        - |
          echo "Waiting for Vault to be ready..."
          until vault status -address=http://vault:8200 > /dev/null 2>&1; do
            echo "Vault is not ready yet, sleeping 2s..."
            sleep 2
          done
          echo "Vault is ready. Writing secrets..."
          
          # Write global backend-runtime-secrets for External Secrets Operator (ESO)
          vault kv put -address=http://vault:8200 secret/backend-runtime-secrets \
            SPRING_DATASOURCE_USERNAME={{ .Values.secrets.SPRING_DATASOURCE_USERNAME | quote }} \
            SPRING_DATASOURCE_PASSWORD={{ .Values.secrets.SPRING_DATASOURCE_PASSWORD | quote }} \
            CLICKHOUSE_USER={{ .Values.secrets.CLICKHOUSE_USER | default "default" | quote }} \
            CLICKHOUSE_PASSWORD={{ .Values.secrets.CLICKHOUSE_PASSWORD | default "default_password" | quote }} \
            MINIO_ACCESS_KEY={{ .Values.secrets.MINIO_ACCESS_KEY | quote }} \
            MINIO_SECRET_KEY={{ .Values.secrets.MINIO_SECRET_KEY | quote }} \
            NEO4J_USER={{ .Values.secrets.NEO4J_USER | default "neo4j" | quote }} \
            NEO4J_PASSWORD={{ .Values.secrets.NEO4J_PASSWORD | quote }} \
            VAULT_TOKEN={{ .Values.config.VAULT_TOKEN | default "vault-root-token" | quote }} \
            SENTRY_DSN={{ .Values.secrets.SENTRY_DSN | default "" | quote }} \
            LANGFUSE_PUBLIC_KEY={{ .Values.secrets.LANGFUSE_PUBLIC_KEY | default "" | quote }} \
            LANGFUSE_SECRET_KEY={{ .Values.secrets.LANGFUSE_SECRET_KEY | default "" | quote }}

          # Write secrets for user-service
          vault kv put -address=http://vault:8200 secret/user-service \
            spring.datasource.username={{ .Values.secrets.SPRING_DATASOURCE_USERNAME | quote }} \
            spring.datasource.password={{ .Values.secrets.SPRING_DATASOURCE_PASSWORD | quote }} \
            minio.access-key={{ .Values.secrets.MINIO_ACCESS_KEY | quote }} \
            minio.secret-key={{ .Values.secrets.MINIO_SECRET_KEY | quote }}
          
          # Write secrets for socialgraph-service
          vault kv put -address=http://vault:8200 secret/socialgraph-service \
            spring.neo4j.authentication.username={{ .Values.secrets.NEO4J_USER | default "neo4j" | quote }} \
            spring.neo4j.authentication.password={{ .Values.secrets.NEO4J_PASSWORD | quote }}

          # Write secrets for notification-service
          vault kv put -address=http://vault:8200 secret/notification-service \
            spring.datasource.username={{ .Values.secrets.SPRING_DATASOURCE_USERNAME | quote }} \
            spring.datasource.password={{ .Values.secrets.SPRING_DATASOURCE_PASSWORD | quote }}

          # Write secrets for feed-service
          vault kv put -address=http://vault:8200 secret/feed-service \
            spring.datasource.username={{ .Values.secrets.SPRING_DATASOURCE_USERNAME | quote }} \
            spring.datasource.password={{ .Values.secrets.SPRING_DATASOURCE_PASSWORD | quote }}

          # Write secrets for groups-service
          vault kv put -address=http://vault:8200 secret/groups-service \
            spring.datasource.username={{ .Values.secrets.SPRING_DATASOURCE_USERNAME | quote }} \
            spring.datasource.password={{ .Values.secrets.SPRING_DATASOURCE_PASSWORD | quote }}
            
          echo "Vault initialized successfully!"
