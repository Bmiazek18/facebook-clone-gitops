apiVersion: v1
kind: Secret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: vault-token-secret
  namespace: {{ .Release.Namespace | default "apps" }}
type: Opaque
stringData:
  token: {{ .Values.config.VAULT_TOKEN | default "vault-root-token" | quote }}
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: vault-backend
  namespace: {{ .Release.Namespace | default "apps" }}
spec:
  provider:
    vault:
      server: "http://vault.apps.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        tokenSecretRef:
          name: vault-token-secret
          key: token
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  name: backend-runtime-secrets-eso
  namespace: {{ .Release.Namespace | default "apps" }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: backend-runtime-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: backend-runtime-secrets
