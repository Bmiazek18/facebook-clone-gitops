apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  name: api-gateway-config
  namespace: {{ .Release.Namespace | default "apps" }}
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;
        client_max_body_size 100M;

        resolver kube-dns.kube-system.svc.cluster.local valid=10s;

        upstream user-service-upstream {
            server userservice:8081;
            keepalive 32;
        }

        upstream chat-service-upstream {
            server chat-service:8087;
            keepalive 32;
        }

        upstream notification-service-upstream {
            server notificationservice:8083;
            keepalive 32;
        }

        upstream search-service-upstream {
            server search-service:8088;
            keepalive 32;
        }

        upstream marketplace-service-upstream {
            server marketplace-service:8090;
            keepalive 32;
        }

        upstream analytics-service-upstream {
            server analytics-service:8095;
            keepalive 32;
        }

        upstream linkguard-service-upstream {
            server linkguard-service:8086;
            keepalive 32;
        }

        upstream meta-ai-service-upstream {
            server meta-ai-service:8000;
            keepalive 32;
        }

        upstream groups-service-upstream {
            server groups-service:9098;
            keepalive 32;
        }

        upstream feed-service-upstream {
            server feedservice:8086;
            keepalive 32;
        }

        upstream apollo-router-upstream {
            server apollo-router:4000;
            keepalive 32;
        }

        upstream tusd-service-upstream {
            server tusd:1080;
            keepalive 32;
        }

        server {
            listen 8080;
            server_name _;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            location /healthz {
                return 200 'OK';
                add_header Content-Type text/plain;
            }

            # GraphQL Federation Supergraph
            location /graphql {
                proxy_pass http://apollo-router-upstream;
            }

            # TUS Resumable Uploads
            location /files/ {
                proxy_pass http://tusd-service-upstream/files/;
                proxy_request_buffering off;
                proxy_buffering off;
                client_max_body_size 500M;
            }

            # User Service
            location /api/users/ {
                proxy_pass http://user-service-upstream/api/users/;
            }
            location /api/user/ {
                proxy_pass http://user-service-upstream/api/user/;
            }

            # Chat Service
            location /api/chat/ {
                proxy_pass http://chat-service-upstream/api/chat/;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
            }

            # Notification Service
            location /api/notifications/ {
                proxy_pass http://notification-service-upstream/api/notifications/;
            }

            # Search Service
            location /api/search/ {
                proxy_pass http://search-service-upstream/api/search/;
            }

            # Marketplace Service
            location /api/marketplace/ {
                proxy_pass http://marketplace-service-upstream/api/marketplace/;
            }
            location /api/v1/listings {
                proxy_pass http://marketplace-service-upstream/api/v1/listings;
            }

            # Analytics Service
            location /api/analytics/ {
                proxy_pass http://analytics-service-upstream/api/analytics/;
            }

            # Linkguard Service
            location /api/linkguard/ {
                proxy_pass http://linkguard-service-upstream/api/linkguard/;
            }

            # Groups Service
            location /api/groups/ {
                proxy_pass http://groups-service-upstream/api/groups/;
            }

            # Feed Service
            location /api/feed/ {
                proxy_pass http://feed-service-upstream/api/feed/;
            }

            # Meta AI Service (LLM streaming / Chat threads)
            location /api/meta-ai/ {
                proxy_pass http://meta-ai-service-upstream/;
                proxy_buffering off;
                proxy_read_timeout 300s;
            }
            location /api/chat-threads {
                proxy_pass http://meta-ai-service-upstream/chat-threads;
                proxy_buffering off;
            }
            location /api/chat-history/ {
                proxy_pass http://meta-ai-service-upstream/chat-history/;
                proxy_buffering off;
            }
            location /api/process-chat {
                proxy_pass http://meta-ai-service-upstream/process-chat;
                proxy_buffering off;
                proxy_read_timeout 300s;
            }
            location /api/generated_charts/ {
                proxy_pass http://meta-ai-service-upstream/generated_charts/;
            }
            location /chat-threads {
                proxy_pass http://meta-ai-service-upstream/chat-threads;
                proxy_buffering off;
            }
            location /chat-history/ {
                proxy_pass http://meta-ai-service-upstream/chat-history/;
                proxy_buffering off;
            }
            location /process-chat {
                proxy_pass http://meta-ai-service-upstream/process-chat;
                proxy_buffering off;
                proxy_read_timeout 300s;
            }
            location /generated_charts/ {
                proxy_pass http://meta-ai-service-upstream/generated_charts/;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  name: api-gateway
  namespace: {{ .Release.Namespace | default "apps" }}
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: config
          configMap:
            name: api-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  name: api-gateway
  namespace: {{ .Release.Namespace | default "apps" }}
  labels:
    app: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
