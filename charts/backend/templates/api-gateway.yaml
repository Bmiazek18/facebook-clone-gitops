apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  name: api-gateway-config
  namespace: {{ .Release.Namespace | default "apps" }}
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;
        client_max_body_size 100M;

        upstream user_service {
            server userservice.apps.svc.cluster.local:8081;
            keepalive 32;
        }

        upstream chat_service {
            server chat-service.apps.svc.cluster.local:8087;
            keepalive 32;
        }

        upstream notification_service {
            server notificationservice.apps.svc.cluster.local:8083;
            keepalive 32;
        }

        upstream search_service {
            server search-service.apps.svc.cluster.local:8088;
            keepalive 32;
        }

        upstream marketplace_service {
            server marketplace-service.apps.svc.cluster.local:8090;
            keepalive 32;
        }

        upstream analytics_service {
            server analytics-service.apps.svc.cluster.local:8095;
            keepalive 32;
        }

        upstream linkguard_service {
            server linkguard-service.apps.svc.cluster.local:8086;
            keepalive 32;
        }

        upstream meta_ai_service {
            server meta-ai-service.apps.svc.cluster.local:8000;
            keepalive 32;
        }

        upstream groups_service {
            server groups-service.apps.svc.cluster.local:8082;
            keepalive 32;
        }

        upstream feed_service {
            server feedservice.apps.svc.cluster.local:8084;
            keepalive 32;
        }

        upstream apollo_router {
            server apollo-router.apps.svc.cluster.local:4000;
            keepalive 32;
        }

        upstream tusd_service {
            server tusd.apps.svc.cluster.local:1080;
            keepalive 32;
        }

        server {
            listen 8080;
            server_name _;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            location /healthz {
                return 200 'OK';
                add_header Content-Type text/plain;
            }

            # GraphQL Federation Supergraph
            location /graphql {
                proxy_pass http://apollo_router;
            }

            # TUS Resumable Uploads
            location /files/ {
                proxy_pass http://tusd_service/files/;
                proxy_request_buffering off;
                proxy_buffering off;
                client_max_body_size 500M;
            }

            # User Service
            location /api/users/ {
                proxy_pass http://user_service/api/users/;
            }
            location /api/user/ {
                proxy_pass http://user_service/api/user/;
            }

            # Chat Service
            location /api/chat/ {
                proxy_pass http://chat_service/api/chat/;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
            }

            # Notification Service
            location /api/notifications/ {
                proxy_pass http://notification_service/api/notifications/;
            }

            # Search Service
            location /api/search/ {
                proxy_pass http://search_service/api/search/;
            }

            # Marketplace Service
            location /api/marketplace/ {
                proxy_pass http://marketplace_service/api/marketplace/;
            }
            location /api/v1/listings {
                proxy_pass http://marketplace_service/api/v1/listings;
            }

            # Analytics Service
            location /api/analytics/ {
                proxy_pass http://analytics_service/api/analytics/;
            }

            # Linkguard Service
            location /api/linkguard/ {
                proxy_pass http://linkguard_service/api/linkguard/;
            }

            # Groups Service
            location /api/groups/ {
                proxy_pass http://groups_service/api/groups/;
            }

            # Feed Service
            location /api/feed/ {
                proxy_pass http://feed_service/api/feed/;
            }

            # Meta AI Service (LLM streaming / Chat threads)
            location /api/meta-ai/ {
                proxy_pass http://meta_ai_service/;
                proxy_buffering off;
                proxy_read_timeout 300s;
            }
            location /chat-threads {
                proxy_pass http://meta_ai_service/chat-threads;
                proxy_buffering off;
            }
            location /chat-history {
                proxy_pass http://meta_ai_service/chat-history;
                proxy_buffering off;
            }
            location /process-chat {
                proxy_pass http://meta_ai_service/process-chat;
                proxy_buffering off;
                proxy_read_timeout 300s;
            }
            location /generated_charts/ {
                proxy_pass http://meta_ai_service/generated_charts/;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  name: api-gateway
  namespace: {{ .Release.Namespace | default "apps" }}
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: config
          configMap:
            name: api-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  name: api-gateway
  namespace: {{ .Release.Namespace | default "apps" }}
  labels:
    app: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
