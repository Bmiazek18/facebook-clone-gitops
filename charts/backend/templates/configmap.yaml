apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: backend-runtime-config
data:
  SPRING_DATASOURCE_URL: {{ .Values.config.SPRING_DATASOURCE_URL | quote }}
  NOTIFICATION_DATASOURCE_URL: {{ .Values.config.NOTIFICATION_DATASOURCE_URL | quote }}
  FEED_DATASOURCE_URL: {{ .Values.config.FEED_DATASOURCE_URL | quote }}
  SPRING_DATA_REDIS_HOST: {{ .Values.config.SPRING_DATA_REDIS_HOST | quote }}
  SPRING_DATA_REDIS_PORT: {{ .Values.config.SPRING_DATA_REDIS_PORT | quote }}
  MINIO_URL: {{ .Values.config.MINIO_URL | quote }}
  MINIO_PUBLIC_ENDPOINT: {{ .Values.config.MINIO_PUBLIC_ENDPOINT | quote }}
  MEDIA_STABLE_URL_BASE: {{ .Values.config.MEDIA_STABLE_URL_BASE | quote }}
  USER_SERVICE_GRPC_ADDRESS: {{ .Values.config.USER_SERVICE_GRPC_ADDRESS | quote }}
  SOCIAL_GRAPH_SERVICE_GRPC_ADDRESS: {{ .Values.config.SOCIAL_GRAPH_SERVICE_GRPC_ADDRESS | quote }}
  SEARCH_SERVICE_GRPC_ADDRESS: {{ .Values.config.SEARCH_SERVICE_GRPC_ADDRESS | quote }}
  FEED_SERVICE_GRPC_ADDRESS: {{ .Values.config.FEED_SERVICE_GRPC_ADDRESS | quote }}
  CHAT_SERVICE_GRPC_ADDRESS: {{ .Values.config.CHAT_SERVICE_GRPC_ADDRESS | quote }}
  SCYLLA_CONTACT_POINTS: {{ .Values.config.SCYLLA_CONTACT_POINTS | quote }}
  MQTT_BROKER_URL: {{ .Values.config.MQTT_BROKER_URL | quote }}
  SPRING_KAFKA_BOOTSTRAP_SERVERS: {{ .Values.config.SPRING_KAFKA_BOOTSTRAP_SERVERS | quote }}
  NEO4J_URI: {{ .Values.config.NEO4J_URI | quote }}
  VAULT_URI: {{ .Values.config.VAULT_URI | quote }}
  SENTRY_ENVIRONMENT: {{ .Values.config.SENTRY_ENVIRONMENT | quote }}
  LINK_GUARD_SERVICE_URL: {{ .Values.config.LINK_GUARD_SERVICE_URL | quote }}
  INFERENCE_SERVICE_URL: {{ .Values.config.INFERENCE_SERVICE_URL | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.OTEL_EXPORTER_OTLP_ENDPOINT | quote }}
  OLLAMA_BASE_URL: {{ .Values.config.OLLAMA_BASE_URL | default "http://ollama-service.apps.svc.cluster.local:11434/v1" | quote }}
  OLLAMA_MODEL: {{ .Values.config.OLLAMA_MODEL | default "qwen2.5:7b" | quote }}
  LANGFUSE_HOST: {{ .Values.config.LANGFUSE_HOST | default "https://cloud.langfuse.com" | quote }}
  CHROMA_HOST: {{ .Values.config.CHROMA_HOST | default "chroma.apps.svc.cluster.local" | quote }}
  CHROMA_PORT: {{ .Values.config.CHROMA_PORT | default "8000" | quote }}
