apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  name: inference-service
  labels:
    app: inference-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference-service
  template:
    metadata:
      labels:
        app: inference-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      {{- if .Values.istio.enabled }}
      serviceAccountName: inference-service-sa
      {{- end }}
      containers:
        - name: inference-service
          image: "{{ .Values.images.inferenceService.repository | default "ghcr.io/bmiazek18/facebook-clone-inference-service" }}:{{ .Values.images.inferenceService.tag | default "latest" }}"
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: backend-runtime-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
          resources:
            {{- toYaml .Values.inferenceResources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  name: inference-service
spec:
  selector:
    app: inference-service
  ports:
    - name: http
      port: 8000
      targetPort: http
