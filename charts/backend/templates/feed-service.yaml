apiVersion: apps/v1
kind: Deployment
metadata:
  name: feedservice
  labels:
    app: feedservice
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: feedservice
  template:
    metadata:
      labels:
        app: feedservice
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8086"
    spec:
      {{- if .Values.istio.enabled }}
      serviceAccountName: feedservice-sa
      {{- end }}
      containers:
        - name: feed-service
          image: "{{ .Values.images.feedService.repository }}:{{ .Values.images.feedService.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8086
            - name: grpc
              containerPort: 9092
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: backend-runtime-config
                  key: FEED_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: backend-runtime-secrets
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-feed-secret
                  key: password
            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: backend-runtime-config
                  key: SPRING_DATA_REDIS_HOST
            - name: SPRING_DATA_REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: backend-runtime-config
                  key: SPRING_DATA_REDIS_PORT
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: backend-runtime-config
                  key: SPRING_KAFKA_BOOTSTRAP_SERVERS
            - name: USER_SERVICE_GRPC_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: backend-runtime-config
                  key: USER_SERVICE_GRPC_ADDRESS
            - name: SOCIAL_GRAPH_SERVICE_GRPC_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: backend-runtime-config
                  key: SOCIAL_GRAPH_SERVICE_GRPC_ADDRESS
            - name: NOTIFICATION_SERVICE_GRPC_ADDRESS
              value: "dns:///notificationservice:9093"
            - name: ABR_SERVICE_GRPC_ADDRESS
              value: "dns:///video-abr-service:9095"
            - name: GROUPS_SERVICE_GRPC_ADDRESS
              value: "dns:///groups-service:9098"
            - name: VAULT_URI
              valueFrom:
                configMapKeyRef:
                  name: backend-runtime-config
                  key: VAULT_URI
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backend-runtime-secrets
                  key: VAULT_TOKEN
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: backend-runtime-secrets
                  key: SENTRY_DSN
            - name: SENTRY_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: backend-runtime-config
                  key: SENTRY_ENVIRONMENT
            - name: LINK_GUARD_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: backend-runtime-config
                  key: LINK_GUARD_SERVICE_URL
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: backend-runtime-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
            - name: JAVA_TOOL_OPTIONS
              value: -Xms128m -Xmx256m
          readinessProbe:
            grpc:
              port: grpc
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: grpc
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: feedservice
spec:
  selector:
    app: feedservice
  ports:
    - name: http
      port: 8086
      targetPort: http
    - name: grpc
      port: 9092
      targetPort: grpc
