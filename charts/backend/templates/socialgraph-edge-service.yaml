apiVersion: apps/v1
kind: Deployment
metadata:
  name: socialgraph-edge
  labels:
    app: socialgraph-edge
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: socialgraph-edge
  template:
    metadata:
      labels:
        app: socialgraph-edge

      annotations:

        prometheus.io/scrape: "true"

        prometheus.io/path: "/actuator/prometheus"

        prometheus.io/port: "8083"
    spec:
      {{- if .Values.istio.enabled }}

      serviceAccountName: socialgraph-edge-sa

      {{- end }}

      containers:
        - name: socialgraph-edge-service
          image: "{{ .Values.images.socialgraphEdgeService.repository }}:{{ .Values.images.socialgraphEdgeService.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: SOCIAL_GRAPH_SERVICE_GRPC_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: backend-runtime-config
                  key: SOCIAL_GRAPH_SERVICE_GRPC_ADDRESS
            - name: JAVA_TOOL_OPTIONS
              value: -Xms128m -Xmx256m
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: socialgraph-edge
spec:
  selector:
    app: socialgraph-edge
  ports:
    - name: http
      port: 8082
      targetPort: http
