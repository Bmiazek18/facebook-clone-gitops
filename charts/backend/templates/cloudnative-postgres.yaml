apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: postgres-user
  namespace: apps
spec:
  instances: 1
  primaryUpdateStrategy: unsupervised
  
  postgresql:
    parameters:
      shared_buffers: "64MB"
      effective_cache_size: "256MB"
      maintenance_work_mem: "32MB"
      checkpoint_completion_target: "0.9"
      wal_buffers: "8MB"
      default_statistics_target: "100"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      work_mem: "4MB"
      min_wal_size: "1GB"
      max_wal_size: "4GB"
      max_worker_processes: "2"
      max_parallel_workers_per_gather: "1"
      max_parallel_workers: "2"
  
  bootstrap:
    initdb:
      database: users_db
      owner: postgres
      secret:
        name: postgres-secret
  
  storage:
    size: 10Gi
    storageClass: local-path
  
  # Health checks
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

---
apiVersion: v1
kind: Secret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: postgres-secret
  namespace: apps
type: Opaque
stringData:
  username: postgres
  password: "change-me-secure-password"

---
apiVersion: v1
kind: Service
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: postgresql-user
  namespace: apps
spec:
  selector:
    cnpg.io/cluster: postgres-user
  ports:
  - port: 5432
    targetPort: 5432
    name: postgresql
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: postgresql-user-rw
  namespace: apps
spec:
  selector:
    cnpg.io/cluster: postgres-user
    role: primary
  ports:
  - port: 5432
    targetPort: 5432
    name: postgresql
  type: ClusterIP

---
