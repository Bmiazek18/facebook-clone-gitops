# router.yaml
supergraph:
  listen: 0.0.0.0:4000
  path: /graphql
  introspection: true

cors:
  policies:
    - origins:
        - https://lab-bm.com
        - https://api.lab-bm.com
        - http://localhost:3000
        - http://localhost:5173
      allow_credentials: true
      methods:
        - GET
        - POST
        - OPTIONS
      allow_headers:
        - authorization
        - content-type
        - x-apollo-operation-id
        - x-apollo-operation-name
        - apollo-require-preflight
        - x-user-id
        - x-actor-id
        - x-entity-type
        - x-original-user-id
        - accept
        - accept-language
        - origin
        - sentry-trace
        - baggage
      expose_headers:
        - content-type
        - authorization
        - sentry-trace
        - baggage

sandbox:
  enabled: true

homepage:
  enabled: false

include_subgraph_errors:
  all: true

health_check:
  listen: 0.0.0.0:8088
  path: /health

headers:
  all:
    request:
      - propagate:
          matching: "(?i)^(authorization|x-.*)$"

rhai:
  scripts: "/dist/config"
  main: "main.rhai"

